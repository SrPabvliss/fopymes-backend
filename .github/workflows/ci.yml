name: CI
description: CI workflow for the finance app

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: npm run build
